<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#221F1A">
<title>إدارة — مناقيش لحم</title>
<style>
:root{
  --ink:#221F1A; --ink-2:#5C564B; --ink-3:#8A8377;
  --paper:#EFECE1; --card:#FFFFFF; --line:#DDD8C8; --soft:#FAF8F2;
  --pist:#4A7C31; --pist-d:#2E5120; --pist-l:#EAF1E2;
  --honey:#C68A12; --honey-l:#FBF0D8;
  --ember:#A93520; --ember-l:#FAE7E2;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--paper);color:var(--ink);
  font-family:system-ui,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  font-size:15px;line-height:1.6;padding-bottom:32px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
:focus-visible{outline:2px solid var(--pist);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.brand{font-size:21px;font-weight:800;line-height:1.15}
.brand span{display:block;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:2px}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.dark{background:var(--ink);border-color:var(--ink);position:relative}
.iconbtn.dark svg{stroke:#fff}
.iconbtn .b{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--ember);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper)}

/* tabs */
.catrow{display:flex;gap:6px;padding:12px 0 12px;overflow-x:auto;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.cat{padding:10px 15px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.cat[aria-pressed="true"]{background:var(--pist);border-color:var(--pist);color:#fff}
.hours{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:9px 12px;background:var(--pist-l);border:1px solid #CFE0C0;border-radius:11px;margin-bottom:12px}
.hours b{font-weight:800;color:var(--pist-d)}
.hours .dot{width:7px;height:7px;border-radius:50%;background:var(--pist);flex:0 0 auto}
.hours.shut{background:var(--honey-l);border-color:#EBD9A8;color:#7A5405}
.hours.shut b{color:#7A5405}.hours.shut .dot{background:var(--honey)}

/* menu grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:20px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.item.sup{border-color:var(--honey);box-shadow:0 0 0 1px var(--honey)}
.item.off{opacity:.5}
.suptag{display:inline-block;background:var(--honey-l);color:#7A5405;border:1px solid #EBD9A8;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;vertical-align:middle}
.offtag{display:inline-block;background:var(--ember-l);color:var(--ember);font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px}
.item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#E8E4D8}
.item .body{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1;gap:8px}
.name{font-weight:700;font-size:15px;line-height:1.3}
.unit{font-size:12px;color:var(--ink-3);font-weight:600}
.sizes{display:flex;flex-wrap:wrap;gap:5px}
.size{padding:5px 9px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2);background:var(--soft);line-height:1.2}
.size[aria-pressed="true"]{background:var(--pist-l);border-color:var(--pist);color:var(--pist-d)}
.size b{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-top:1px}
.size[aria-pressed="true"] b{color:var(--pist)}
.foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.price{font-weight:800;font-size:16px;color:var(--pist-d)}
.price small{font-size:11px;font-weight:500;color:var(--ink-3)}
.add{margin-inline-start:auto;width:36px;height:36px;border-radius:10px;background:var(--pist);color:#fff;font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center;transition:transform .1s}
.add:active{transform:scale(.9)}
.qbadge{margin-inline-start:auto;display:flex;align-items:center;gap:10px;background:var(--pist-l);border:1px solid var(--pist);border-radius:10px;padding:3px}
.qbadge button{width:28px;height:28px;border-radius:7px;color:var(--pist-d);font-size:18px;font-weight:800;line-height:1}
.qbadge span{min-width:16px;text-align:center;font-weight:800;color:var(--pist-d)}

/* cart bar */
.cartbar{position:fixed;bottom:0;inset-inline:0;z-index:50;background:var(--ink);color:#fff;padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:none}
.cartbar.on{display:block}
.cartbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cartbar b{font-size:17px;font-weight:800}
.cartbar .go{background:var(--pist);padding:11px 20px;border-radius:11px;font-weight:800;color:#fff;margin-inline-start:auto}
.cartbar .cnt{background:rgba(255,255,255,.16);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700}

/* ticket */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;position:relative;padding:16px 16px 20px;margin-bottom:22px}
.ticket::after{content:"";position:absolute;bottom:-9px;inset-inline:-1px;height:10px;
  background:radial-gradient(circle at 6px 0,transparent 5.5px,var(--line) 6px,var(--line) 6.6px,transparent 7px) repeat-x,
             radial-gradient(circle at 6px -1px,transparent 5.5px,var(--card) 6px) repeat-x;background-size:12px 10px}
.tline{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.tline:last-of-type{border-bottom:none}
.tline .t-n{flex:1;font-weight:600;line-height:1.4}
.tline .t-n em{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.tline .t-p{font-weight:700;white-space:nowrap}
.total{display:flex;padding-top:13px;margin-top:6px;border-top:2px solid var(--ink);font-weight:800;font-size:18px}
.total span:last-child{margin-inline-start:auto;color:var(--pist-d)}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.field textarea{resize:vertical;min-height:64px}
.err{color:var(--ember);font-size:12.5px;font-weight:700;margin-top:5px;display:none}
.field.bad input,.field.bad textarea{border-color:var(--ember);background:var(--ember-l)}
.field.bad .err{display:block}
.tiny{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:5px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--pist-l);border-color:var(--pist);color:var(--pist-d)}
.submit{width:100%;padding:15px;border-radius:12px;background:var(--pist);color:#fff;font-size:16px;font-weight:800;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:9px}
.submit.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.submit.ink{background:var(--ink)}
.submit svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.submit:disabled{opacity:.55}
.locbtn{width:100%;padding:15px;border-radius:12px;border:1.5px dashed var(--pist);background:var(--pist-l);color:var(--pist-d);font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}
.locbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.locok{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:var(--pist-l);border:1px solid var(--pist)}
.locok b{display:block;color:var(--pist-d);font-size:15px}
.locok span{font-size:12.5px;color:var(--ink-2)}
.locok button{margin-inline-start:auto;font-weight:800;color:var(--pist-d);text-decoration:underline;font-size:13.5px}
.locfail{background:var(--honey-l);border:1px solid #EBD9A8;color:#7A5405;font-size:13px;padding:10px 12px;border-radius:10px;margin-top:9px;font-weight:600}
.linkbtn{display:block;margin:14px auto 0;font-weight:700;color:var(--ink-2);font-size:14px;text-decoration:underline}

/* admin */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.25}
.stat span{font-size:12px;color:var(--ink-3);font-weight:600}
.olist{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.olist{grid-template-columns:repeat(2,1fr)}}
.ohead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px}
.t-new{background:var(--ember-l);color:var(--ember)}
.t-prep{background:var(--honey-l);color:#8A5E06}
.t-ready{background:var(--pist-l);color:var(--pist-d)}
.t-done{background:#E7E4DA;color:var(--ink-2)}
.onum{font-size:16px;font-weight:800}
.otime{font-size:12px;color:var(--ink-3);margin-inline-start:auto}
.who{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}
.who div{display:flex;gap:6px;padding:1px 0}
.who i{font-style:normal;color:var(--ink-3);min-width:52px;font-size:12.5px;font-weight:700}
.act{flex:1;padding:12px;border-radius:10px;font-weight:800;font-size:14.5px;color:#fff;background:var(--pist)}
.act.grey{background:#E7E4DA;color:var(--ink-2)}
.act.line{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.actrow{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty b{display:block;font-size:18px;color:var(--ink-2);margin-bottom:6px;font-weight:800}
.done-screen{text-align:center;padding:34px 16px}
.done-screen .mark{width:66px;height:66px;border-radius:50%;background:var(--pist);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 16px;font-weight:700}
.done-screen h2{font-weight:800;margin:0 0 6px}
.bignum{font-size:34px;font-weight:800;color:var(--pist-d);letter-spacing:1px;margin:6px 0}
.hint{background:var(--honey-l);border:1px solid #EBD9A8;border-radius:12px;padding:11px 13px;font-size:13px;color:#7A5405;margin:14px 0;text-align:start}
h2.sec{font-size:19px;font-weight:800;margin:18px 0 8px}
.subtabs{display:flex;gap:6px;margin:12px 0 14px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.subtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.row img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#E8E4D8;flex:0 0 auto}
.row .rn{flex:1;min-width:0}
.row .rn b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn span{font-size:12px;color:var(--ink-3);font-weight:600}
.row .rb{width:34px;height:34px;border-radius:9px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.row .rb svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row .rb.del svg{stroke:var(--ember)}
.addrow{width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--pist);background:var(--pist-l);color:var(--pist-d);font-weight:800;font-size:14.5px;margin-bottom:16px}
table.rep{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
table.rep th,table.rep td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--line)}
table.rep th{background:var(--soft);font-weight:800;font-size:12.5px;color:var(--ink-2)}
table.rep tr:last-child td{border-bottom:none}
table.rep td.n{font-weight:800;white-space:nowrap}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(34,31,26,.5);display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.on{display:flex}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:800}
.sizeedit{display:flex;gap:8px;margin-bottom:8px}
.sizeedit input{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:0}
.sizeedit input.p{max-width:110px}
.sizeedit button{width:40px;border-radius:9px;background:var(--ember-l);color:var(--ember);font-weight:800;flex:0 0 auto}
.imgpick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.imgpick img{width:70px;height:70px;border-radius:12px;object-fit:cover;background:#E8E4D8;border:1px solid var(--line)}
.toast{position:fixed;bottom:80px;inset-inline:0;margin:0 auto;width:max-content;max-width:88%;background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.lock{max-width:340px;margin:60px auto;text-align:center}
.lock .pad{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
.lock h2{margin:0 0 4px;font-size:20px;font-weight:800}
.lock p{margin:0 0 16px;color:var(--ink-3);font-size:13.5px}
.lock input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;text-align:center;font-size:22px;letter-spacing:6px;font-weight:800;background:var(--soft)}



/* ---- قائمة طولية بسيطة ---- */
.seclabel{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:1px}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:10px}
.frow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.frow.sup{border-color:var(--honey);box-shadow:0 0 0 1px var(--honey)}
.frow>img{width:88px;height:88px;border-radius:11px;object-fit:cover;background:#E8E4D8;flex:0 0 auto}
.fmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fmid .name{font-size:15.5px;font-weight:800;line-height:1.25}
.fmid .unit{font-size:12px;color:var(--ink-3);font-weight:600}
.fmid .price{font-size:16px;font-weight:800;color:var(--pist-d)}
.fmid .price small{font-size:11px;font-weight:600;color:var(--ink-3)}
.stepper{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:46px}
.stepper button{width:46px;height:38px;border-radius:11px;font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center;transition:transform .1s}
.stepper button:active{transform:scale(.9)}
.stepper .plus{background:var(--pist);color:#fff}
.stepper .minus{background:var(--pist-l);color:var(--pist-d);border:1px solid var(--pist)}
.stepper .q{font-size:17px;font-weight:800;color:var(--pist-d);line-height:1}
.sizes.row{gap:5px}

/* contact + sham */
.contact{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px 16px;margin:8px 0 24px}
.contact h3{margin:0 0 4px;font-size:18px;font-weight:800}
.contact p{margin:0 0 14px;font-size:13px;color:#B9B3A6;line-height:1.5}
.crow{display:grid;gap:9px;grid-template-columns:1fr}
@media(min-width:520px){.crow{grid-template-columns:1fr 1fr}}
.cbtn{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.1);text-align:start}
.cbtn svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.cbtn span{display:block;line-height:1.3}
.cbtn b{display:block;font-size:15px;font-weight:800;color:#fff;direction:ltr;text-align:start}
.cbtn i{font-style:normal;font-size:11.5px;color:#B9B3A6}
.cbtn.wa{background:#1FA855}
.cbtn.wa i{color:#D6F0E0}
.submit.wa{background:#1FA855}
.sham{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;margin-bottom:12px}
.shead{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-bottom:10px}
.shead b{font-size:16px;font-weight:800}
.shead span{font-size:12px;color:var(--ink-3);font-weight:600}
.sham img{width:190px;max-width:70%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line);padding:5px}
.sname{font-weight:700;margin-top:9px;font-size:14.5px}
.sid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-2);word-break:break-all;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin:7px 0;direction:ltr}
.scopy{width:100%;padding:11px;border-radius:10px;background:var(--pist-l);border:1px solid var(--pist);color:var(--pist-d);font-weight:800;font-size:14px}
.snote{font-size:12.5px;color:var(--honey);font-weight:700;margin-top:9px}


/* ---- حالة الاتصال والتتبّع ---- */
.netbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:11px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.netbar.ok{background:var(--pist-l);border:1px solid #CFE0C0;color:var(--ink-2)}
.netbar.off{background:var(--ember-l);border:1px solid #F0C9C0;color:#7A2A18}
.netbar b{font-weight:800}
.netbar.ok b{color:var(--pist-d)}
.netbar .ndot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.netbar.ok .ndot{background:var(--pist);animation:pulse 2s infinite}
.netbar.off .ndot{background:var(--ember)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.netbar button{margin-inline-start:auto;font-weight:800;text-decoration:underline;color:inherit;font-size:12.5px}
.ccode{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--soft);border:1px solid var(--line);color:var(--ink-2);letter-spacing:1px}
.sent{font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;margin:12px 0}
.sent.ok{background:var(--pist-l);border:1px solid #CFE0C0;color:var(--pist-d)}
.sent.bad{background:var(--honey-l);border:1px solid #EBD9A8;color:#7A5405}
.sent button{text-decoration:underline;font-weight:800;color:inherit}
.track{display:grid;gap:0;text-align:start;margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tstep{display:flex;align-items:center;gap:11px;padding:7px 0;position:relative}
.tstep .tdot{width:22px;height:22px;border-radius:50%;background:#E7E4DA;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto;z-index:1}
.tstep.on .tdot{background:var(--pist)}
.tstep b{font-weight:700;font-size:14px;color:var(--ink-3)}
.tstep.on b{color:var(--ink)}
.tstep:not(:last-child)::before{content:"";position:absolute;inset-inline-start:10px;top:26px;width:2px;height:16px;background:#E7E4DA}
.tstep.on:not(:last-child)::before{background:var(--pist)}

/* print */
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;padding:0;color:#000;font-size:13px}
  @page{margin:8mm}
  .rc{max-width:78mm;margin:0 auto}
  .rc h1{font-size:17px;margin:0 0 2px;text-align:center}
  .rc .sub{text-align:center;font-size:11px;margin-bottom:8px}
  .rc hr{border:none;border-top:1px dashed #000;margin:7px 0}
  .rc .l{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .rc .tt{font-weight:800;font-size:15px;border-top:2px solid #000;padding-top:5px;margin-top:5px}
  .rc table{width:100%;border-collapse:collapse;font-size:12px}
  .rc table th,.rc table td{border-bottom:1px solid #999;padding:3px 4px;text-align:start}
}

/* ===== إضافات النسخة الجديدة ===== */
.item{position:relative}
.disctag{position:absolute;inset-inline-start:8px;top:8px;z-index:3;background:#d92b2b;color:#fff;
  font-weight:900;font-size:12px;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.price s.oldp{color:#d92b2b;opacity:.85;font-weight:700;font-size:.82em;margin-inline-end:6px;text-decoration:line-through}
.seclabel.deals{color:#d92b2b}
.item.hasdisc{outline:2px solid rgba(217,43,43,.35)}
.gate{max-width:520px;margin:0 auto;padding:6px 2px 30px}
.gate h2{font-size:20px;margin:14px 0 4px}
.gate .lead{color:var(--muted,#6b6b6b);font-size:13.5px;line-height:1.7;margin:0 0 14px}
.gate .err{color:#d92b2b;font-size:12.5px;font-weight:700;margin:6px 2px 0}
.gate .ok{background:rgba(74,124,49,.12);border:1px solid rgba(74,124,49,.35);border-radius:12px;
  padding:10px 12px;font-size:13px;font-weight:700;color:#2f5a1e;margin:8px 0}
.profstrip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(0,0,0,.08);
  border-radius:14px;padding:10px 12px;margin:10px 0 4px}
.profstrip b{font-size:13.5px}
.profstrip span{display:block;font-size:11.5px;color:#777;margin-top:2px}
.profstrip button{margin-inline-start:auto;background:none;border:1px solid rgba(0,0,0,.15);
  border-radius:10px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
</style>

/* ============ التخزين المحلي ============ */
const ROLE = 'manager';            // 'customer' أو 'manager'
const isMgr = ()=>ROLE==='manager';
const KP = 'mnq2_'+ROLE+'_';   /* ذاكرة مستقلة تماماً عن النسخة القديمة */
const K = {data:KP+'data_v3', imgs:KP+'imgs_v3', orders:KP+'orders_v3', set:KP+'set_v3'};
function load(key,fb){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):structuredClone(fb); }catch(e){ return structuredClone(fb); } }
function save(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); return true; }catch(e){ toast('المساحة ممتلئة — احذف صور أو طلبات قديمة'); return false; } }

let DATA   = load(K.data, DEFAULT_DATA);
let IMGC   = load(K.imgs, {});
let orders = load(K.orders, []);
let _oldSet = load(K.set, {});
let SET    = Object.assign(structuredClone(DEFAULT_SETTINGS), _oldSet);
if(_oldSet && _oldSet.pass!==undefined && _oldSet.wa===undefined){   // ترقية من نسخة سابقة
  SET.wa=DEFAULT_SETTINGS.wa; SET.openH=9; SET.closeH=2;
  SET.shamOn=true; SET.shamName=DEFAULT_SETTINGS.shamName; SET.shamId=DEFAULT_SETTINGS.shamId;
  if(!SET.phone) SET.phone=DEFAULT_SETTINGS.phone;
  save(K.set,SET);
}

const saveData   = ()=>save(K.data,DATA);
const saveImgs   = ()=>save(K.imgs,IMGC);
const saveOrders = ()=>save(K.orders,orders);
const saveSet    = ()=>save(K.set,SET);

function imgOf(key){ return IMGC[key] || IMG_DEFAULT[key] || 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="#E8E4D8"/></svg>'); }


/* ============ الربط بالسيرفر (Firebase Realtime DB) ============ */
const DB_DEFAULT = 'https://manaqish-60058-default-rtdb.europe-west1.firebasedatabase.app';
function dbBase(){
  let u = String(SET.db||'').trim();
  /* يقبل النطاقين: firebaseio.com و firebasedatabase.app */
  if(!/^https?:\/\/[^\s]+\.(firebaseio\.com|firebasedatabase\.app)/i.test(u)) u = DB_DEFAULT;
  return u.replace(/\/+$/,'');
}
const dbUrl = ()=> dbBase();
let netOK=false, es=null, firstSync=true;

function rkeyNew(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function shortCode(k){ return String(k).slice(-4).toUpperCase(); }
function remoteShape(o){
  return {at:o.at,lines:o.lines,sub:o.sub,fee:o.fee,total:o.total,name:o.name,phone:o.phone,
          addr:o.addr,note:o.note,type:o.type,pay:o.pay,loc:o.loc||null,status:o.status,code:o.code};
}
async function pushOrder(o){
  if(!dbUrl()) return false;
  try{
    const r=await fetch(dbUrl()+'/orders/'+o.rkey+'.json',
      {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(remoteShape(o))});
    return r.ok;
  }catch(e){ return false; }
}
async function patchStatus(o){
  if(!dbUrl()||!o.rkey) return;
  try{ await fetch(dbUrl()+'/orders/'+o.rkey+'.json',
    {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:o.status})}); }catch(e){}
}
async function deleteRemote(o){
  if(!dbUrl()||!o.rkey) return;
  try{ await fetch(dbUrl()+'/orders/'+o.rkey+'.json',{method:'DELETE'}); }catch(e){}
}
async function retryPush(id){
  const o=orders.find(x=>x.id===id)||lastOrder; if(!o) return;
  toast('جاري الإرسال…');
  const ok=await pushOrder(o);
  o.sent=ok; saveOrders(); render();
  toast(ok?'وصل الطلب للمحل ✓':'تعذّر الاتصال — تأكد من الإنترنت');
}

function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=new C();
    [0,0.2,0.4].forEach((t,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.value=[880,1175,1568][i];
      o.connect(g); g.connect(c.destination);
      const st=c.currentTime+t;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.3,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.18);
      o.start(st); o.stop(st+0.2);
    });
  }catch(e){}
}
function notifyNew(o){
  beep();
  toast('🔔 طلب جديد وصل — #'+o.id);
  try{
    if(window.Notification && Notification.permission==='granted')
      new Notification('طلب جديد #'+o.id,{body:(o.name||'زبون')+' — '+money(o.total)+' '+SET.currency});
  }catch(e){}
}

/* ---- المدير: استقبال لحظي ---- */
function startStream(){
  if(!isMgr()||!dbUrl()) return;
  try{ if(es) es.close(); }catch(e){}
  try{
    es=new EventSource(dbUrl()+'/orders.json');
    es.addEventListener('open',()=>{ netOK=true; stopPoll(); render(); });
    es.addEventListener('put',ev=>onStream(ev));
    es.addEventListener('patch',ev=>onStream(ev));
    es.onerror=()=>{ netOK=false; startPoll(); render(); };
    setTimeout(()=>{ if(!netOK) startPoll(); }, 6000);
  }catch(e){ netOK=false; startPoll(); }
}

/* ---- قناة احتياطية: سحب دوري يعمل على كل النطاقات ---- */
let pollT=null, statusT=null, menuT=null;
function stopPoll(){ if(pollT){ clearInterval(pollT); pollT=null; } }
async function pollOrders(){
  if(!isMgr()||!dbUrl()) return;
  try{
    const r = await fetch(dbUrl()+'/orders.json?orderBy=%22%24key%22&limitToLast=60');
    if(!r.ok) throw 0;
    const d = await r.json();
    netOK = true;
    if(d) Object.keys(d).sort().forEach(k=>mergeRemote(k,d[k]));
    firstSync = false;
  }catch(e){ netOK = false; }
  render();
}
function startPoll(){ if(pollT) return; pollOrders(); pollT=setInterval(pollOrders,5000); }

function startStatusPoll(o){
  if(isMgr()||!o||!o.rkey) return;
  if(statusT) clearInterval(statusT);
  const tick = async ()=>{
    try{
      const r = await fetch(dbUrl()+'/orders/'+o.rkey+'/status.json');
      if(!r.ok) return;
      const st = await r.json();
      const cur = orders.find(x=>x.rkey===o.rkey);
      if(cur && st && FLOW[st] && cur.status!==st){
        cur.status = st; saveOrders(); try{ beep(); }catch(e){}
        if(view==='done') render();
      }
    }catch(e){}
  };
  tick(); statusT = setInterval(tick, 7000);
}
function startMenuPoll(){
  if(isMgr()) return;
  if(menuT) clearInterval(menuT);
  menuT = setInterval(fetchMenu, 60000);
}

function onStream(ev){
  let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
  netOK=true;
  const path=m.path||'/', d=m.data;
  if(path==='/'){
    if(d) Object.keys(d).sort().forEach(k=>mergeRemote(k,d[k]));
    firstSync=false; render(); return;
  }
  const k=path.split('/')[1];
  if(!k) return;
  if(d===null){ orders=orders.filter(x=>x.rkey!==k); saveOrders(); render(); return; }
  mergeRemote(k,d); render();
}
function mergeRemote(k,d){
  if(!d||!d.lines) return;
  const ex=orders.find(x=>x.rkey===k);
  if(ex){ if(d.status && d.status!==ex.status){ ex.status=d.status; saveOrders(); } return; }

const MASTER_NAME = 'عبد الرحمن الخميس';
const FAKE_WORDS = ['ملك','ملكه','ملكة','عاشق','عاشقه','عاشقة','دلوعه','دلوعة','مجنون','مجنونه',
  'حزين','حزينه','الاحزان','الأحزان','المستحيل','عشق','دمعه','دمعة','جريح','مكسور','شبح','ذئب',
  'الليل','وحيد','وحيده','برنس','كيوت','بلاك','ملاك','صمت','غموض','مزاجي','شقي','بريء','فارس',
  'صقر','نسر','اسد','أسد','سيف','قلب','king','queen','love','black','angel','prince','princess',
  'cute','dark','ghost','wolf','vip','user','test'];

function normA(s){
  return String(s||'')
    .replace(/[\u064B-\u0652\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function nameCheck(v){
  const raw = String(v||'').trim().replace(/\s+/g,' ');
  if(normA(raw) === normA(MASTER_NAME)) return '';
  if(!raw) return 'اكتب اسمك الثنائي أو الثلاثي';
  if(!/^[\u0621-\u064Aa-zA-Z\s]+$/.test(raw)) return 'الاسم حروف فقط — بلا أرقام أو رموز';
  const parts = raw.split(' ').filter(Boolean);
  if(parts.length < 2) return 'اكتب اسمك الثنائي — اسمك واسم عائلتك';
  if(parts.some(p=>p.length < 2)) return 'يرجى إدخال اسمك الحقيقي كاملاً';
  const nm = normA(raw), toks = nm.split(' ');
  const bad = FAKE_WORDS.some(w=>{ const x=normA(w); return toks.includes(x) || (x.length>4 && nm.indexOf(x)>=0); });
  if(bad) return 'يرجى إدخال اسمك الحقيقي — الأسماء الوهمية غير مقبولة';
  return '';
}

function b64e(str){ const b=new TextEncoder().encode(str); let x=''; b.forEach(c=>x+=String.fromCharCode(c)); return btoa(x); }
function b64d(b){ const x=atob(b); const a=new Uint8Array(x.length); for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i); return new TextDecoder().decode(a); }
function encodeOrder(o){
  const c={i:o.id,k:o.rkey,cd:o.code,t:o.at,l:o.lines.map(l=>[l.n,l.size,l.p,l.q]),s:o.sub,f:o.fee,T:o.total,
           nm:o.name,ph:o.phone,ad:o.addr,no:o.note,ty:o.type,py:o.pay,lo:o.loc?[o.loc.lat,o.loc.lng]:null};
  return 'MN1.'+b64e(JSON.stringify(c));
}
function decodeOrder(code){
  const m=String(code).match(/MN1\.([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try{
    const c=JSON.parse(b64d(m[1]));
    return {id:c.i,rkey:c.k||rkeyNew(),code:c.cd||'',uid:uid(),at:c.t||Date.now(),
      day:today(new Date(c.t||Date.now())),status:'new',
      lines:(c.l||[]).map(a=>({key:a[0]+'|'+(a[1]||''),id:'',n:a[0],size:a[1]||'',p:a[2],q:a[3]})),
      sub:c.s,fee:c.f||0,total:c.T,name:c.nm||'',phone:c.ph||'',addr:c.ad||'',note:c.no||'',
      type:c.ty||'delivery',pay:c.py||'cash',loc:c.lo?{lat:c.lo[0],lng:c.lo[1]}:null,sent:true};
  }catch(e){ return null; }
}

function orderText(o){
  const L=o.lines.map(l=>`• ${l.q}× ${l.n}${l.size?' — '+l.size:''}  (${money(l.p*l.q)})`).join('\n');
  let t=`طلب رقم ${o.code||o.id}\n${L}\n`;
  if(o.fee) t+=`التوصيل: ${money(o.fee)}\n`;
  t+=`المجموع: ${money(o.total)} ${SET.currency}\n`;
  if(o.name)  t+=`\nالاسم: ${o.name}`;
  if(o.phone) t+=`\nالهاتف: ${o.phone}`;
  t += o.type==='delivery' ? `\nتوصيل` : `\nاستلام من المحل`;
  t += o.pay==='sham' ? `\nالدفع: شام كاش (${SET.shamId})` : `\nالدفع: نقداً عند الاستلام`;
  if(o.loc)  t+=`\nالموقع: https://maps.google.com/?q=${o.loc.lat},${o.loc.lng}`;

  if(!isMgr()) t+=`\n\n———\nكود الطلب (للمحل):\n${encodeOrder(o)}`;
  return t;
}
function copyText(txt){
  const done=()=>toast('تم نسخ الطلب');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('تعذّر النسخ'); }
  document.body.removeChild(ta);
}

}

/* ============ التقارير ============ */
function reportFor(day){
  const list=orders.filter(o=>o.day===day);
  const counts={};
  list.forEach(o=>o.lines.forEach(l=>{
    const k=l.n+(l.size?' — '+l.size:'');
    if(!counts[k]) counts[k]={n:k,q:0,v:0};
    counts[k].q+=l.q; counts[k].v+=l.p*l.q;
  }));
  return {
    day, count:list.length,
    doneCount:list.filter(o=>o.status==='done').length,
    total:list.reduce((s,o)=>s+o.total,0),
    fees:list.reduce((s,o)=>s+(o.fee||0),0),
    items:Object.values(counts).sort((a,b)=>b.q-a.q)
  };
}

function setFree(v){ SET.freeDelivery=v; saveSet(); render(); publishMenu(true); }
function setSham(v){ saveSettings(true); SET.shamOn=v; saveSet(); render(); }
function pickQR(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const im=new Image();
    im.onload=()=>{ const S=640,c=document.createElement('canvas');c.width=S;c.height=S;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,S,S);
      const side=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,S,S);
      IMGC['shamqr']=c.toDataURL('image/jpeg',0.85); saveImgs(); render(); toast('تم تحديث رمز QR'); };
    im.src=rd.result; };
  rd.readAsDataURL(f); inp.value='';
}
function saveSettings(quiet){
  const g=id=>$(id)?$(id).value:'';
  SET.wa=(g('s_wa')||SET.wa).replace(/[^\d]/g,'');
  if($('s_db')){ const nd=g('s_db').trim(); if(nd!==SET.db){ SET.db=nd; setTimeout(startStream,200); } }
  if($('s_shname')) SET.shamName=g('s_shname');
  if($('s_shid'))   SET.shamId=g('s_shid');
  SET.shop=g('s_shop')||SET.shop; SET.sub=g('s_sub'); SET.phone=g('s_phone'); SET.addr=g('s_addr');
  SET.currency=g('s_cur')||'ل.س';
  if($('s_chan')) SET.chan=g('s_chan').trim();
  if($('s_ig'))   SET.ig=g('s_ig').trim();
  SET.openH=Math.min(23,Math.max(0,Number(g('s_open'))||0));
  SET.closeH=Math.min(24,Math.max(0,Number(g('s_close'))));
  if($('s_fee')) SET.deliveryFee=Number(g('s_fee'))||0;
  const p=g('s_pass'); if(p) SET.pass=p;
  saveSet(); publishMenu(true); if(quiet) return; render(); toast('تم حفظ الإعدادات');
}
function wipeOrders(){ if(!confirm('حذف كل الطلبات والتقارير؟ لا يمكن التراجع.')) return; orders=[]; saveOrders(); render(); toast('تم حذف الطلبات'); }
function resetMenu(){ if(!confirm('إرجاع القائمة والأسعار الأصلية؟')) return; DATA=structuredClone(DEFAULT_DATA); IMGC={}; saveData(); saveImgs(); cat=DATA.cats[0].id; render(); toast('تم إرجاع القائمة'); }

function exportAll(){
  const blob=new Blob([JSON.stringify({DATA,IMGC,orders,SET},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('تم تجهيز الملف');
}
function importAll(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const j=JSON.parse(rd.result);
      if(j.DATA) DATA=j.DATA; if(j.IMGC) IMGC=j.IMGC; if(j.orders) orders=j.orders;
      if(j.SET) SET=Object.assign(structuredClone(DEFAULT_SETTINGS),j.SET);
      saveData(); saveImgs(); saveOrders(); saveSet();
      cat=DATA.cats[0]?DATA.cats[0].id:''; render(); toast('تم الاستيراد');
    }catch(e){ toast('الملف غير صالح'); } };
  rd.readAsText(f); inp.value='';
}

function openItem(id){

    ${editSizes.length?'':`<div class="field"><label>السعر الأساسي</label><input id="e_p" type="number" value="${it.p||0}"></div>`}
    <div class="field"><label>التنزيلات — نسبة الخصم %</label>
      <input id="e_disc" type="number" min="0" max="90" value="${discOf(it)}" oninput="editItem.disc=Number(this.value)||0;drawDiscHint()">
      <div class="tiny" id="discHint">${discOf(it)?('السعر بعد الخصم: '+(editSizes.length?('كل حجم يُخصم '+discOf(it)+'%'):money(dPrice(it.p||0,it)))):'اتركها صفراً إن لم يكن على الصنف خصم'}</div>
      <div class="tiny">الصنف المخفَّض يظهر في قسم «التنزيلات» وفي قسمه الأصلي، وسعره القديم مشطوب بالأحمر.</div></div>

function drawDiscHint(){
  const h=$('discHint'); if(!h) return;
  const d=discOf(editItem);
  h.textContent = d ? (editSizes.length ? ('كل حجم يُخصم '+d+'%')
                    : ('السعر بعد الخصم: '+money(dPrice(Number(($('e_p')||{}).value)||0,editItem))))
                    : 'اتركها صفراً إن لم يكن على الصنف خصم';
}
function addSize(){ syncSheet(); editSizes.push({k:'',p:0}); drawItemSheet(); }
function syncSheet(){
  if($('e_n')) editItem.n=$('e_n').value;
  if($('e_cat')) editItem.cat=$('e_cat').value;
  if($('e_note')) editItem.note=$('e_note').value;
  if($('e_p')) editItem.p=Number($('e_p').value)||0;
  if($('e_disc')) editItem.disc=Math.min(90,Math.max(0,Number($('e_disc').value)||0));
}
function pickImg(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const S=420, c=document.createElement('canvas'); c.width=S; c.height=S;
      const x=c.getContext('2d');
      const side=Math.min(im.width,im.height);
      x.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,S,S);
      editImgData=c.toDataURL('image/jpeg',0.72);
      if($('prevImg')) $('prevImg').src=editImgData;
      toast('تم اختيار الصورة');
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f); inp.value='';
}
function saveItem(){
  syncSheet();
  if(!editItem.n.trim()){ toast('اكتب اسم الصنف'); return; }
  editSizes=editSizes.filter(s=>s.k.trim());
  editItem.disc=discOf(editItem);
  if(!editItem.disc) delete editItem.disc;
  if(editSizes.length){ editItem.sizes=editSizes; delete editItem.p; }
  else { delete editItem.sizes; editItem.p=Number(editItem.p)||0; }
  if(editImgData){ const key='u_'+editItem.id; IMGC[key]=editImgData; editItem.img=key; saveImgs(); }
  const ix=DATA.items.findIndex(x=>x.id===editItem.id);
  if(ix>=0) DATA.items[ix]=editItem; else DATA.items.push(editItem);
  saveData(); closeModal(); cat=editItem.cat; render(); publishMenu(true); toast('تم الحفظ');
}
function delItem(id){
  const it=itemById(id); if(!it) return;
  if(!confirm('حذف «'+it.n+'» من القائمة؟')) return;
  DATA.items=DATA.items.filter(x=>x.id!==id);
  if(IMGC['u_'+id]){ delete IMGC['u_'+id]; saveImgs(); }
  saveData(); render(); publishMenu(true); toast('تم الحذف');
}
function toggleOn(id){ const it=itemById(id); if(!it) return; it.on = it.on===false; saveData(); render(); publishMenu(true); }

function editCat(id){
  const c=id?DATA.cats.find(x=>x.id===id):null;
  $('sheet').innerHTML=`<h3>${c?'تعديل قسم':'قسم جديد'}</h3>
    <div class="field"><label>اسم القسم</label><input id="c_n" value="${c?esc(c.name):''}"></div>
    <div class="field"><label>وحدة البيع (اختياري) — مثلاً: القطعة</label><input id="c_u" value="${c?esc(c.unit||''):''}"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="submit" style="margin:0" onclick="saveCat('${id||''}')">حفظ</button>
      <button class="submit ghost" style="margin:0;flex:0 0 110px" onclick="closeModal()">إلغاء</button></div>`;
  $('modal').classList.add('on');
}
function saveCat(id){
  const n=$('c_n').value.trim(), u=$('c_u').value.trim();
  if(!n){ toast('اكتب اسم القسم'); return; }
  if(id){ const c=DATA.cats.find(x=>x.id===id); c.name=n; c.unit=u; }
  else { const nid=uid(); DATA.cats.push({id:nid,name:n,unit:u}); cat=nid; }
  saveData(); closeModal(); render(); publishMenu(true); toast('تم الحفظ');
}
function delCat(id){
  const n=DATA.items.filter(i=>i.cat===id).length;
  if(!confirm(n?('القسم يحتوي '+n+' صنف — حذفه يحذفها كلها. متابعة؟'):'حذف هذا القسم؟')) return;
  DATA.cats=DATA.cats.filter(c=>c.id!==id);
  DATA.items=DATA.items.filter(i=>i.cat!==id);
  setTimeout(()=>publishMenu(true),300);
  if(cat===id) cat=DATA.cats[0]?DATA.cats[0].id:'';
  saveData(); render(); toast('تم الحذف');
}

/* ============ نقل الطلبات والقائمة ============ */
function openImport(){
  $('sheet').innerHTML=`<h3>إضافة طلب من واتساب</h3>
    <div class="tiny" style="margin:0 0 10px">انسخ رسالة الطلب كاملة من واتساب والصقها هنا — سأستخرج الطلب تلقائياً.</div>
    <div class="field"><textarea id="impCode" style="min-height:130px" placeholder="الصق رسالة الطلب هنا…"></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="submit" style="margin:0" onclick="importOrder()">إضافة الطلب</button>
      <button class="submit ghost" style="margin:0;flex:0 0 110px" onclick="closeModal()">إلغاء</button></div>`;
  $('modal').classList.add('on');
  setTimeout(()=>{ const t=$('impCode'); if(t) t.focus(); },80);
}
function manualOrder(){ mode='cust'; view='menu'; window.scrollTo(0,0); render(); toast('اختر الأصناف ثم أكّد — سيُسجَّل بدون واتساب'); }

function menuCode(){
  return 'MNU1.'+b64e(JSON.stringify({
    c:DATA.cats.map(x=>[x.id,x.name,x.unit||'']),
    i:DATA.items.map(x=>[x.id,x.cat,x.n,x.img,x.p==null?null:x.p,x.sizes||null,x.note||'',x.on===false?0:1,x.imgSuper||'']),
    s:{shop:SET.shop,sub:SET.sub,phone:SET.phone,wa:SET.wa,currency:SET.currency,openH:SET.openH,closeH:SET.closeH,
       freeDelivery:SET.freeDelivery,deliveryFee:SET.deliveryFee,shamOn:SET.shamOn,shamName:SET.shamName,shamId:SET.shamId,db:SET.db}
  }));
}
function applyMenuCode(code){
  const m=String(code).match(/MNU1\.([A-Za-z0-9+/=]+)/); if(!m) return false;
  try{
    const j=JSON.parse(b64d(m[1]));
    DATA={cats:j.c.map(a=>({id:a[0],name:a[1],unit:a[2]})),
          items:j.i.map(a=>{const o={id:a[0],cat:a[1],n:a[2],img:a[3],note:a[6],on:!!a[7]};
            if(a[5]) o.sizes=a[5]; else o.p=a[4]; if(a[8]) o.imgSuper=a[8]; return o;})};
    if(j.s) Object.assign(SET,j.s);
    saveData(); saveSet(); return true;
  }catch(e){ return false; }
}
function openMenuCode(){
  $('sheet').innerHTML=`<h3>كود القائمة والأسعار</h3>
    <div class="tiny" style="margin:0 0 10px">أرسل هذا الكود لأي جهاز فيه تطبيق الزبون لتحديث الأسعار عنده.</div>
    <div class="field"><textarea id="mcode" readonly style="min-height:120px;font-size:11px;direction:ltr">${menuCode()}</textarea></div>
    <div style="display:flex;gap:8px">
      <button class="submit" style="margin:0" onclick="copyText(menuCode())">نسخ الكود</button>
      <button class="submit ghost" style="margin:0;flex:0 0 110px" onclick="closeModal()">إغلاق</button></div>`;
  $('modal').classList.add('on');
}
function openMenuUpdate(){
  $('sheet').innerHTML=`<h3>تحديث القائمة والأسعار</h3>
    <div class="field"><label>كلمة السر</label><input id="u_pass" type="password" inputmode="numeric" placeholder="••••"></div>
    <div class="field"><label>كود القائمة</label><textarea id="u_code" style="min-height:110px;direction:ltr" placeholder="MNU1...."></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="submit" style="margin:0" onclick="doMenuUpdate()">تحديث</button>
      <button class="submit ghost" style="margin:0;flex:0 0 110px" onclick="closeModal()">إلغاء</button></div>`;
  $('modal').classList.add('on');
}
function doMenuUpdate(){
  if($('u_pass').value!==String(SET.pass)){ toast('كلمة السر غير صحيحة'); return; }
  if(applyMenuCode($('u_code').value)){ closeModal(); cart=[]; render(); toast('تم تحديث القائمة'); }
  else toast('الكود غير صالح');
}

/* ============ الرسم ============ */
function render(){
  const m=$('main');
  if(mode==='cust' && view==='cart') syncForm();
  const a=document.activeElement, fid=a&&a.id?a.id:null, pos=a&&a.selectionStart!=null?a.selectionStart:null;

  $('brandName').childNodes[0].nodeValue=SET.shop;
  $('brandSub').textContent=SET.sub;
  mode='admin';
  $('btnAdmin').style.display='none';
  $('btnCart').style.display='none';

  if(!isMgr() && (!profOK() || gateEdit)){
    m.innerHTML = gateView();
    $('cartbar').classList.remove('on');
    const hc0=$('hdrCount'); hc0.textContent=cartCount(); hc0.hidden=true;
    document.body.style.paddingBottom='32px';
    if(fid){ const el=$(fid); if(el){ el.focus(); if(pos!=null&&el.setSelectionRange){ try{el.setSelectionRange(pos,pos)}catch(e){} } } }
    return;
  }

  if(mode==='admin'){
    if(!adminOK) m.innerHTML=lockView();
    else if(adminTab==='orders')   m.innerHTML=adminShell(ordersView());
    else if(adminTab==='reports')  m.innerHTML=adminShell(reportsView());
    else if(adminTab==='menu')     m.innerHTML=adminShell(menuAdminView());
    else                           m.innerHTML=adminShell(settingsView());
  }
  else if(view==='cart') m.innerHTML=cartView();
  else if(view==='done') m.innerHTML=doneView();
  else m.innerHTML=menuView();

  if(fid){ const el=$(fid); if(el){ el.focus(); if(pos!=null&&el.setSelectionRange){ try{el.setSelectionRange(pos,pos)}catch(e){} } } }

  const n=cartCount();
  const hc=$('hdrCount'); hc.textContent=n; hc.hidden=!n;
  const show = mode==='cust' && view==='menu' && n>0;
  $('cartbar').classList.toggle('on',show);
  $('cbCount').textContent=n;
  $('cbTotal').textContent=money(cartTotal())+' '+SET.currency;
  document.body.style.paddingBottom = show?'96px':'32px';
}

window.addEventListener('beforeunload',()=>{ if(mode==='cust'&&view==='cart') syncForm(); });

/* المدير: يبدأ على لوحة الطلبات ويتصل بالسيرفر */
if(isMgr()){ mode='admin'; adminTab='orders'; startStream(); askNotify();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !netOK) startStream(); });
}

/* الزبون: يستقبل الأسعار الجديدة تلقائياً + ضغطة مطوّلة للتحديث اليدوي */
if(!isMgr()){
  startMenuStream(); startMenuPoll();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) fetchMenu(); });
  const b=$('brandName'); let lt=null;
  const start=()=>{ clearTimeout(lt); lt=setTimeout(openMenuUpdate,2500); };
  const stop =()=>clearTimeout(lt);
  ['touchstart','mousedown'].forEach(e=>b.addEventListener(e,start,{passive:true}));
  ['touchend','touchmove','touchcancel','mouseup','mouseleave'].forEach(e=>b.addEventListener(e,stop,{passive:true}));
}

render();

</script>
</body>
</html>
