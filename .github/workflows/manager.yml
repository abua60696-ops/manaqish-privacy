      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/manaqish-manager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manaqish-manager-apk
          path: out/manaqish-manager.apk
