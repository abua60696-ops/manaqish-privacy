name: Build Customer APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build customer web app (Vite)
        working-directory: app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER || '963947420675' }}
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Generate Android project
        run: |
          set -e
          mkdir -p android-customer/app/src/main/java/com/manaqish/customer
          mkdir -p android-customer/app/src/main/assets
          mkdir -p android-customer/app/src/main/res/values
          mkdir -p android-customer/app/src/main/res/drawable
          mkdir -p android-customer/app/src/main/res/mipmap-anydpi-v26

          # ننسخ ناتج بناء تطبيق الزبائن (React/Vite) كاملاً إلى أصول تطبيق الأندرويد
          cp -r app/dist/. android-customer/app/src/main/assets/

          cat > android-customer/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MnaqishCustomer"
          include ':app'
          EOF

          cat > android-customer/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android-customer/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android-customer/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.manaqish.customer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.manaqish.customer"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > android-customer/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="tel" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.MnaqishCustomer">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-customer/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">مناقيش دير الزور</string>
          </resources>
          EOF

          cat > android-customer/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="brick">#FFB5442E</color>
              <color name="sand">#FFFFFBF5</color>
              <color name="ember">#FFE67E22</color>
          </resources>
          EOF

          cat > android-customer/app/src/main/res/values/themes.xml <<'EOF'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.MnaqishCustomer" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/brick</item>
                  <item name="android:windowBackground">@color/sand</item>
                  <item name="colorPrimary">@color/brick</item>
                  <item name="colorAccent">@color/ember</item>
              </style>
          </resources>
          EOF

          cat > android-customer/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#B5442E" />
          </shape>
          EOF

          cat > android-customer/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E67E22"
                  android:pathData="M54,54 m-30,0 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0" />
              <path android:fillColor="#B5442E"
                  android:pathData="M42,42 m-5,0 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0" />
              <path android:fillColor="#B5442E"
                  android:pathData="M66,40 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
              <path android:fillColor="#B5442E"
                  android:pathData="M70,62 m-5,0 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0" />
          </vector>
          EOF

          cat > android-customer/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android-customer/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android-customer/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > android-customer/app/src/main/java/com/manaqish/customer/MainActivity.java <<'EOF'
          package com.manaqish.customer;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;
          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          // غلاف WebView بسيط لعرض تطبيق الزبائن (React/Vite) المبني مسبقاً في مجلد assets
          // ملاحظة: تسجيل الدخول بحساب Google قد لا يعمل داخل WebView المضمّن بسبب
          // سياسة Google لمنع تسجيل الدخول من متصفحات مضمّنة — الطلب كضيف يعمل دائماً بشكل كامل،
          // وتسجيل الدخول الكامل بجوجل متاح عبر متصفح الهاتف أو تثبيت التطبيق كـ PWA.
          public class MainActivity extends AppCompatActivity {

              private static final String START_URL = "file:///android_asset/index.html";
              private static final int REQ_LOCATION = 1002;

              private WebView web;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;
              private long lastBackPress = 0;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setSupportMultipleWindows(true);
                  CookieManager.getInstance().setAcceptCookie(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          geoOrigin = origin;
                          geoCallback = callback;
                          if (ContextCompat.checkSelfPermission(MainActivity.this,
                                  Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              ActivityCompat.requestPermissions(MainActivity.this,
                                      new String[]{Manifest.permission.ACCESS_FINE_LOCATION,
                                                   Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                          }
                      }

                      // نوافذ منبثقة (مثل نافذة تسجيل الدخول بجوجل) تُفتح في متصفح الهاتف الخارجي
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, android.os.Message resultMsg) {
                          WebView.HitTestResult result = view.getHitTestResult();
                          String url = result != null ? result.getExtra() : null;
                          if (url != null) openExternally(url);
                          return false;
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (web.canGoBack()) {
                              web.goBack();
                          } else if (System.currentTimeMillis() - lastBackPress < 2000) {
                              finish();
                          } else {
                              lastBackPress = System.currentTimeMillis();
                              toast("اضغط رجوع مرة أخرى للخروج");
                          }
                      }
                  });

                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(START_URL);
              }

              private boolean handleUrl(String url) {
                  if (url.startsWith("file:///android_asset/")) return false;
                  if (url.startsWith("http://") || url.startsWith("https://")) {
                      if (url.contains("wa.me") || url.contains("api.whatsapp.com")
                              || url.contains("maps.google") || url.contains("google.com/maps")
                              || url.contains("accounts.google.com")) {
                          openExternally(url);
                          return true;
                      }
                      return false;
                  }
                  if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.startsWith("intent:")) {
                      openExternally(url);
                      return true;
                  }
                  return false;
              }

              private void openExternally(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  } catch (ActivityNotFoundException e) {
                      toast("لا يوجد تطبيق مناسب لفتح هذا الرابط");
                  }
              }

              private void toast(String m) {
                  runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_SHORT).show());
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions,
                                                     @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_LOCATION && geoCallback != null) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      geoCallback.invoke(geoOrigin, granted, false);
                      geoCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(@NonNull Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-customer
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk out/manaqish-customer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manaqish-customer-apk
          path: out/manaqish-customer.apk
